[package]
edition = "2021"
name = "rustyx"
version = "0.2.0"
authors = ["Mohammad Bilal <bilalmalik1561@gmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A Rust web framework inspired by ExpressJS with ORM support for MongoDB, MySQL, SQLite, and PostgreSQL"
documentation = "https://docs.rs/rustyx"
readme = "README.md"
keywords = [
    "web",
    "framework",
    "express",
    "api",
    "upload",
]
categories = [
    "web-programming",
    "web-programming::http-server",
    "database",
]
license = "MIT"
repository = "https://github.com/Mohammad007/rustyx"

[features]
default = ["sqlite"]
full = [
    "mysql",
    "postgres",
    "sqlite",
    "mongodb",
]
mongodb = ["dep:mongodb"]
mysql = ["sqlx/mysql"]
postgres = ["sqlx/postgres"]
sqlite = ["sqlx/sqlite"]

[lib]
name = "rustyx"
path = "src/lib.rs"

[[bin]]
name = "rustyx"
path = "src/main.rs"

[[example]]
name = "basic_api"
path = "examples/basic_api/main.rs"

[[example]]
name = "file_upload"
path = "examples/file_upload/main.rs"

[[test]]
name = "framework_tests"
path = "tests/framework_tests.rs"

[dependencies.anyhow]
version = "1.0"

[dependencies.async-trait]
version = "0.1"

[dependencies.bytes]
version = "1.5"

[dependencies.chrono]
version = "0.4"
features = ["serde"]

[dependencies.futures]
version = "0.3"

[dependencies.http-body-util]
version = "0.1"

[dependencies.hyper]
version = "1.1"
features = ["full"]

[dependencies.hyper-util]
version = "0.1"
features = ["full"]

[dependencies.matchit]
version = "0.7"

[dependencies.mime]
version = "0.3"

[dependencies.mongodb]
version = "2.8"
optional = true

[dependencies.once_cell]
version = "1.19"

[dependencies.parking_lot]
version = "0.12"

[dependencies.pin-project-lite]
version = "0.2"

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.serde_json]
version = "1.0"

[dependencies.sqlx]
version = "0.7"
features = [
    "runtime-tokio",
    "tls-rustls",
]
optional = true

[dependencies.thiserror]
version = "1.0"

[dependencies.tokio]
version = "1.35"
features = ["full"]

[dependencies.tracing]
version = "0.1"

[dependencies.tracing-subscriber]
version = "0.3"
features = [
    "fmt",
    "env-filter",
]

[dependencies.url]
version = "2.5"

[dependencies.uuid]
version = "1.6"
features = [
    "v4",
    "serde",
]

[dev-dependencies.reqwest]
version = "0.11"
features = ["json"]

[dev-dependencies.tokio-test]
version = "0.4"

[profile.release]
opt-level = 3
lto = true
