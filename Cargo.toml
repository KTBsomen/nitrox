[package]
edition = "2021"
name = "nitrox"
version = "0.0.2"
authors = [
    "Somen Das <somen8099@gmail.com>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A fast, minimalist web framework for Rust inspired by ExpressJS"
documentation = "https://docs.rs/nitrox"
readme = "README.md"
keywords = [
    "web",
    "framework",
    "express",
    "api",
    "http",
]
categories = [
    "web-programming",
    "web-programming::http-server",
    "network-programming",
]
license = "MIT"
repository = "https://github.com/KTBsomen/nitrox"

[lib]
name = "nitrox"
path = "src/lib.rs"

[[bin]]
name = "nitrox"
path = "src/main.rs"

[[example]]
name = "basic_api"
path = "examples/basic_api/main.rs"

[[example]]
name = "file_upload"
path = "examples/file_upload/main.rs"

[[example]]
name = "state_benchmark"
path = "examples/state_benchmark/main.rs"

[[example]]
name = "modular_api"
path = "examples/modular_api/main.rs"

[[test]]
name = "framework_tests"
path = "tests/framework_tests.rs"

[dependencies.anyhow]
version = "1.0.104"

[dependencies.async-trait]
version = "0.1.92"

[dependencies.bytes]
version = "1.12.1"

[dependencies.chrono]
version = "0.4.45"
features = ["serde"]

[dependencies.futures]
version = "0.3.34"

[dependencies.http-body-util]
version = "0.1.5"

[dependencies.hyper]
version = "1.12.0"
features = ["full"]

[dependencies.hyper-util]
version = "0.1.21"
features = ["full"]

# Keep matchit pinned to 0.7 for native Express-style ':id' routing syntax compatibility
[dependencies.matchit]
version = "0.7"

[dependencies.mime]
version = "0.3.17"

[dependencies.once_cell]
version = "1.21.4"

[dependencies.parking_lot]
version = "0.12.5"

[dependencies.pin-project-lite]
version = "0.2.17"

[dependencies.serde]
version = "1.0.229"
features = ["derive"]

[dependencies.serde_json]
version = "1.0.154"

[dependencies.thiserror]
version = "2.0.21"

[dependencies.tokio]
version = "1.54.1"
features = ["full"]

[dependencies.tracing]
version = "0.1.44"

[dependencies.tracing-subscriber]
version = "0.3.23"
features = [
    "fmt",
    "env-filter",
]

[dependencies.url]
version = "2.5.8"

[dependencies.uuid]
version = "1.29.0"
features = [
    "v4",
    "v5",
    "serde",
]

[dev-dependencies.reqwest]
version = "0.12.28"
features = ["json"]

[dev-dependencies.tokio-test]
version = "0.4.6"

[profile.release]
opt-level = 3
lto = true
